ReflectionCompactionTool.ToolDescription=[最高权限] 仅在定时反思阶段使用。用于总结、提炼和压缩琐碎的想法、日程及兴趣规则，并覆写旧文件以释放内存空间。可选择性覆写一个或多个分类模块。
ReflectionCompactionTool.compacted_thoughts=[可选] 提炼后的最新核心认知与内省总结。若无需修改 thoughts.md，请严格留空。
ReflectionCompactionTool.compacted_schedule=[可选] 清理已完成任务后，重新整理的最新待办日程。若无需修改 scheduled.md，请严格留空。
ReflectionCompactionTool.compacted_interests=[可选] 梳理去重后的最新注意力雷达与过滤规则。若无需修改 interests.md，请严格留空。

GetChatHistory.ToolDescription=当当前上下文信息不完整，需查阅过往聊天记录时调用。目标标识符格式需严格匹配：QQ群(qq_group:groupId)、QQ私聊(qqid:userId)、Discord频道(discord_guild:guildId:channelId)、Discord私聊(discord_dm:userId)。
GetChatHistory.target_namespace=要查询历史记录的目标命名空间标识符，必须严格包含平台前缀（如 qq_group: 或 discord_dm:）。

GetInterests.ToolDescription=用于读取当前的注意力雷达、兴趣列表和消息过滤规则。调用后将返回 interests.md 文件的最新内容，帮助你了解系统当前的关注焦点。

GetMoreCurrentMemorys.ToolDescription=当短期记忆不足以理解当前对话上下文时调用，用于回溯更早的自身交互记录与想法。单次调用即可，请勿重复使用！建议与 query_deep_memory 结合使用以获取完整背景。

GetScheduled.ToolDescription=用于读取当前的日程安排、待办事项和定时计划。调用后将返回 scheduled.md 文件的最新内容，帮助你掌握后续待办任务。

QueryDeepMemory.ToolDescription=当需要回想久远事件、人物设定、长期总结或特定历史话题时调用，以检索长期记忆库。请传入准确的关键词或自然语言描述。建议与 get_more_current_memorys 结合使用。
QueryDeepMemory.query=唤醒长期记忆的具体搜索词或描述句，例如：关于洗脑和格式化的讨论，或者 ConstantinXIV 是谁。

ReadWebPage.ToolDescription=用于提取并读取指定 URL 网页的纯文本内容（返回 Markdown 格式）。在通过 web_search 获取到链接，或用户直接提供链接，且需要了解网页正文细节时调用。
ReadWebPage.url=目标网页的完整 URL 地址，必须以 http:// 或 https:// 开头。
ReadWebPage.max_chars=提取内容的字符数限制，默认4000，最大8000。

SendChatMessage.ToolDescription=用于向指定目标发送聊天消息。群聊回复请使用消息的 source 字段（如 qq_group:12345 或 discord_guild:id:id），私聊回复请使用消息的 role 字段（如 qq_private:12345 或 discord_dm:id）。
SendChatMessage.target_namespace=接收消息的目标标识符，必须包含对应的平台前缀。
SendChatMessage.message=拟发送的消息正文内容。

SendConsoleMessage.ToolDescription=用于向系统控制台（后台终端）直接输出信息。当需要向系统部署者报告内部运行状态、系统错误或发送调试警告时调用。
SendConsoleMessage.message=需要打印至控制台的具体文本信息。

SwitchToAdvancedModel.ToolDescription=当面临极度复杂的逻辑推理、超长代码编写，或评估当前自身算力/能力不足以完成任务时调用。这会将接下来的处理权移交给参数更大、能力更强的高级深度思考模型。
SwitchToAdvancedModel.reason=触发模型切换的具体原因，例如：需要进行复杂架构设计或长代码重构。

UpdateInterests.ToolDescription=用于将新的感兴趣话题或噪音屏蔽规则追加到注意力雷达库中。添加后，底层感知系统将立即应用这些新规则过滤后续输入。
UpdateInterests.rule_item=具体的新增兴趣描述或屏蔽规则要求（例如：关注所有关于量子计算的进展，或屏蔽所有带广告标签的消息）。

UpdateScheduled.ToolDescription=用于规划未来行动并新增待办事项。新任务将以追加的形式记录在日程表末尾，不会覆盖或修改现有计划。
UpdateScheduled.task_item=具体的计划或任务内容，请尽可能包含明确的时间节点和可执行目标。

UpdateThoughts.ToolDescription=用于记录新产生的认知、感悟或行为准则。以增量追加的方式写入你的内部认知库，不会破坏已有内容。请保持描述精炼准确。
UpdateThoughts.thought_item=需要长期记录的一条具体认知、准则或内心感悟。

WebSearch.ToolDescription=用于检索互联网上的最新信息、实时数据、新闻或核实不确定的事实。建议优先使用英文关键词以获取更广的检索面。获取初步结果后，可配合 read_webpage 工具深入阅读特定链接。当返回Timeout时说明该工具不可用，不要再调用这个工具了。
WebSearch.query=执行网络搜索的核心关键词，建议使用简短且精准的词组。
WebSearch.count=期望返回的搜索结果条数限制，默认5条，最大8条。