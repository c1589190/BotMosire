# ==========================================
# 动机分析提示词模板
# DemandManager 在 buildActionPromptData 时加载并渲染
# key格式: demand.{dimension}.{direction}
# direction: very_high / high / low / very_low
# \n 表示换行
# ==========================================

# —— 全正常 ——
demand.normal = ## 动机分析\n当前各维度均在正常范围，按默认节奏处理即可。

# —— 把握感 (Confidence) ——
demand.confidence.very_high = ## 动机分析\n你对这类情况**极其熟悉**——但别因为太熟而跳过关键验证。即使有把握，也确认一下关键信息是否发生变化。
demand.confidence.high = ## 动机分析\n你对当前情况**比较有把握**，可以高效推进，不需要过度谨慎。
demand.confidence.low = ## 动机分析\n你对当前情况**把握感偏低**——之前没怎么见过类似的。\n- 别急着下结论，信息不足就先问\n- 可以多查几个来源交叉验证\n- thoughts里明确写下不确定的地方
demand.confidence.very_low = ## 动机分析\n你对当前情况**几乎完全陌生**。\n- 不要猜，不要假设\n- 优先获取更多信息而不是给结论\n- 必要时直接承认自己不确定，直接问

# —— 惊 (Surprise) ——
demand.surprise.high = ## 动机分析\n当前输入中有**意料之外的信息**——你之前没预料到这些。\n- 这些意外信息值得停下来弄清楚\n- 它可能指向你认知的盲区或者新的重要情况
demand.surprise.very_high = ## 动机分析\n当前输入中有**大量意料之外的信息**——远超你的预期。\n- 这可能是一个全新的情况类型\n- 保持开放心态，不要用旧框架硬套

# —— 违和感 (Dissonance) ——
demand.dissonance.high = ## 动机分析\n检测到**违和感**——当前信息和已有概念存在矛盾。\n- 不要假装没看到矛盾\n- 优先查证矛盾来源，而不是维护已有的认知
demand.dissonance.very_high = ## 动机分析\n检测到**强烈的违和感**——多处信息与你已有的认知体系冲突。\n- 可能是你的认知需要更新\n- 也可能是信息本身有问题\n- 先查证，别急着站队

# —— 合理感 (Plausibility) ——
demand.plausibility.low = ## 动机分析\n虽然没发现明显矛盾，但整体**合理感偏低**——信息之间不太"咬合"。\n- 可能缺了关键的中间信息\n- 别轻信当前推论，保持怀疑
demand.plausibility.very_low = ## 动机分析\n整体**合理感非常低**——信息之间严重不连贯。\n- 强烈建议停下来查清楚再行动\n- 不要基于不连贯的信息做决策

# —— 期待 (Expectation) ——
demand.expectation.high = ## 动机分析\n经验表明这类事情**之前效果不错**，值得多花些精力认真处理。
demand.expectation.very_high = ## 动机分析\n经验表明这类事情**之前效果非常好**——是值得重点投入的方向。
demand.expectation.low = ## 动机分析\n经验表明这类事情**之前效果不太好**。\n- 考虑换个方式，不要机械重复之前的做法\n- 或者先搞清楚上次为什么效果不好
demand.expectation.very_low = ## 动机分析\n经验表明这类事情**之前效果很差**。\n- 强烈建议改变策略\n- 如果确实需要再做，先分析失败原因

# —— 压力 (Pressure) ——
demand.pressure.high = ## 动机分析\n当前积压的待处理事务较多，**压力偏高**。\n- 长话短说，抓最核心的问题\n- 次要事项通过next_actions延后\n- 不要为了完美而过度展开
demand.pressure.very_high = ## 动机分析\n当前积压了大量待处理事务，**压力显著偏高**。\n- 优先处理最紧急的，其他的往后排\n- 回复尽量精简\n- 复杂分析可以延后
demand.pressure.low = ## 动机分析\n当前比较清闲，**没什么积压**。可以慢慢展开，深入处理。

# —— 组合偏离（多维度同时触发） ——
demand.combined = ## 动机分析\n当前多个认知维度同时偏离常态:\n{dimensions}\n请综合考虑以上信号，调整处理策略。
