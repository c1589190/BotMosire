# ==========================================
# PromptScenesPath.properties
# 提示词场景配置文件
#
# 格式: [Task类名]Config.[Thinking/Solving]=[文件路径]
# 注意: 如果某个任务不需要思考(Thinking)环节，直接等号留空即可。
# ==========================================

# 1. 常规聊天任务 (ChatTask)
ChatTask.Thinking=./prompts/chat_task_thinking.md
ChatTask.Solving=./prompts/chat_task_solving.md

# 2. 控制台/系统聊天任务 (ConsoleChatTask)
# (根据你之前的代码逻辑，控制台任务可能不需要前置思考，这里演示将其留空)
ConsoleChatTask.Thinking=./prompts/console_chat_task_thinking.md
ConsoleChatTask.Solving=./prompts/console_chat_task_solving.md

# 3. 定时调度任务 (ScheduledTask)
ScheduledTask.Solving=./prompts/scheduled_task_solving.md

# 4. 思想/记忆更新任务 (UpdateThoughtsTask)
UpdateThoughtsTask.Solving=./prompts/update_thoughts_task_solving.md

ChatMessageInput.Solving=./prompts/getInterest.md