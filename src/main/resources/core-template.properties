# ==========================================
# V4 Core 认知架构配置文件
# 此文件独立于 application.properties，专门管理 V4 认知引擎的全部参数
# ==========================================

# ==========================================
# 1. 认知准备池参数 (Cognitive Prepare Pool)
# ==========================================

# 选取得分基线：(semanticWeight + practicalBonus) 低于此值的单元不会被选中执行
v4.core.baselineThreshold=1.0

# 每 tick ContinueWeight 衰减系数（0~1，越大衰减越慢，1=不衰减）
v4.core.continueWeightDecay=0.9

# ContinueWeight 上限
v4.core.maxContinueWeight=5.0

# 准备池最大容量（超限后旧的被淘汰）
v4.core.maxPoolSize=32

# 超过此 tick 数未被选中的单元将被强制移除
v4.core.maxTicksWithoutSelect=20

# ActionLoop tick 间隔（毫秒），控制认知循环的"心跳"频率
v4.core.cognitiveTickMs=2000

# LLM 单次 boost ContinueWeight 的上限
v4.core.singleBoostCap=1.0

# ==========================================
# 2. 经验检索参数 (Experience Retrieval)
# ==========================================

# 从 ExperiencesDB 检索多少条先验经验
v4.core.topNActionPredicts=5

# 每个 UE 节点增加多少条经验请求量
v4.core.scalePerUENode=2

# 先验经验最大条数上限（防止 prompt 爆炸）
v4.core.maxActionPredicts=15

# 每条先验经验文本最大字符数（超出则截断，影响 LLM 看到的经验完整度）
v4.core.predictTextMaxChars=2000

# ==========================================
# 3. 感觉维度参数 (Feeling Dimensions)
# ==========================================

# 厌倦阈值：activationCount 超过此值进入"永熟悉"状态
v4.core.habituationLimit=10

# BFS 最大搜索层数
v4.core.bfsMaxLayers=3

# BFS 每层权重衰减因子（0~1）
v4.core.bfsLayerDecay=0.7

# ==========================================
# 4. 去重参数
# ==========================================

# embedding 余弦相似度去重阈值（超过此值的单元视为重复）
v4.core.dedupThreshold=0.85

# ==========================================
# 5. 来源优先级 (Source Priority) — 外源消息的实践权重
# ==========================================

# 文件巡视产生单元的基础来源优先级
v4.source.filePriority=0.6

# 文件巡视间隔（tick 数）
v4.file.surveyIntervalTicks=8

# 文件巡视空闲阈值（池大小低于此值才触发巡视）
v4.file.idlePoolThreshold=2

# 自我检查产生单元的基础来源优先级
v4.source.selfCheckPriority=0.5

# 自我检查间隔（tick 数）
v4.tick.selfCheckIntervalTicks=30

# 自我检查是否需要池空闲才触发
v4.tick.selfCheckRequireIdle=true

# 自我检查空闲判断阈值（池大小低于此值才触发）
v4.tick.selfCheckIdleThreshold=3

# ==========================================
# 6. 实践加成 (Practical Bonus) — 内源任务继承父权重 + 定值
# ==========================================

# next_action：LLM 显式规划的下一步，sourcePriority = 父权重 + 此值
v4.bonus.nextAction=0.2

# 续命任务（无 finish_action 时自动重建）的加成
v4.bonus.continued=0.1

# 工具执行结果汇总入池的固定来源优先级
v4.bonus.toolSummary=0.1

# ==========================================
# 7. 行动模板匹配参数 (Action Template Matcher)
# ==========================================

# 工具在匹配经验中出现比例的最低阈值
v4.template.minToolRatio=0.6

# 最小匹配经验数（低于此数不输出模板）
v4.template.minMatchCount=3

# 最多输出的模板数
v4.template.maxTemplates=5

# ==========================================
# 8. 注意力机制参数 (Attention Manager)
# ==========================================

# 注意力资源池上限
v4.attention.poolMax=100.0

# 每 tick 注意力资源恢复量
v4.attention.regenPerTick=5.0

# 每 tick 最多关注多少个单元
v4.attention.maxAttendUnits=5

# 每 tick 注意力衰减系数（未被持续关注的单元注意力消退速度）
v4.attention.decayPerTick=0.05

# ==========================================
# 9. 注意力态度参数 (Attention Attitude)
# ==========================================

# 注意力态度缩放因子：multiplier = 1 + rawModulation * scale
v4.attention.attitudeScale=0.5

# 注意力态度取值范围上限
v4.attention.attitudeMax=1.0

# 注意力态度取值范围下限
v4.attention.attitudeMin=-1.0

# 注意力态度每 tick 自然衰减系数（0=不衰减）
v4.attention.attitudeDecay=0.002

# 外部输入触发感觉的态度增量
v4.attention.boostExternal=0.02

# LLM 内源任务触发感觉的态度增量基准
v4.attention.boostEndogenous=0.05

# 被选中执行的任务触发感觉的态度增量
v4.attention.boostSelected=0.08

# ==========================================
# 10. 语义疲劳参数 (Fatigue Manager)
# ==========================================

# 近期处理历史最大条目数（环形缓冲上限）
v4.fatigue.maxHistory=30

# 时间衰减系数：recencyWeight = exp(-age * decayRate)
v4.fatigue.decayRate=0.08

# 疲劳对选择得分的敏感度：penalty = 1 / (1 + fatigue * sensitivity)
v4.fatigue.sensitivity=2.5

# 超过此 tick 数的历史条目自动清理
v4.fatigue.maxAgeTicks=200

# ==========================================
# 11. 互斥检测 v2 参数 (Intra-Triggered Dissonance)
# ==========================================

# 触发相似度下限：余弦相似度达到此值的感觉视为被 action 触发
v4.intratrigger.triggerThreshold=0.4

# 最多分析几个触发感觉
v4.intratrigger.maxTriggered=20

# 最少需要几个触发感觉才做分析（太少无意义）
v4.intratrigger.minTriggered=4

# 孤立阈值：触发感觉到其他 peer 的平均距离超过此值视为"触发但孤立"
v4.intratrigger.isolationThreshold=0.6

# 远距对阈值：两个触发感觉的相似度低于此值视为"远距触发对"
v4.intratrigger.pairThreshold=0.15

# 最多报告几个互斥/失调候选
v4.intratrigger.maxReport=8

# 是否启用触发感觉聚类检测
v4.intratrigger.clusterEnabled=true

# ==========================================
# 12. Chat 消息聚合参数 (Chat Message Aggregation)
# ==========================================

# 每个 source 桶最少攒几条消息才 flush
v4.chat.batchMinMessages=3

# 每个 source 桶最多等待多少毫秒后强制 flush
v4.chat.batchMaxWaitMs=5000

# flush 后同一 source 的冷却时间（毫秒）
v4.chat.batchCooldownMs=3000

# 私聊消息的最低 flush 消息数（低于群聊阈值，更快响应）
v4.chat.batchPrivateMinMessages=1

# ==========================================
# 13. Prompt 大小管理 (Prompt Size Control)
# ==========================================

# LLM 用户 prompt 最大字符数（超出则智能截断，保留头尾）
v4.prompt.maxChars=24000

# 准备池摘要最多显示的单元数（控制 prompt 大小）
v4.prompt.poolSummaryMaxUnits=10

# 方法论/工具指南文本最大字符数（注入 prompt 前截断到此值）
v4.prompt.maxMethodologyChars=4000

# 截断优先级（逗号分隔列表，排前面的先被截断）
# 可选值: methodology, experiences, pool_summary
v4.prompt.truncationPriority=methodology,experiences,pool_summary

# ==========================================
# 14. 调试/指标参数
# ==========================================

# 是否启用注意力指标记录
v4.debug.attentionMetrics=false

# 注意力指标环形缓冲区容量
v4.debug.attentionMetricsBufferSize=100
