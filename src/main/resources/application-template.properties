# ==========================================
# LivingLoop Agent 主配置文件 (模板)
# 提示: 系统会优先读取环境变量 SILICONFLOW_API_KEY，若不存在则读取本文件中的 apiKey 配置。
# ==========================================

# ------------------------------------------
# 1. LLM 矩阵配置 (混合大模型编排)
# ------------------------------------------

# [门神模型 Gatekeeper]
# 职责：用于消息进件时的快速分类、判断是否值得关注、过滤群聊噪音。
# 建议：使用响应速度极快的小模型，无需过高智商，温度可调低以保证决策的一致性。
llm.gatekeeper.apiBase=https://api.siliconflow.cn/v1
llm.gatekeeper.apiKey=
llm.gatekeeper.chatModel=Qwen/Qwen3.5-4B
llm.gatekeeper.temperature=0.3
llm.gatekeeper.enableCoT=false

# [战略规划模型 Planner] 【新增】
# 职责：在大脑采取行动前，负责第 0 轮预思考（Plan阶段）。它负责阅读任务、分析局势并制定工具调用的多步计划。
# 建议：使用具备强逻辑推理能力、长上下文理解能力的中大模型。开启 CoT (思维链) 效果更佳。
llm.planner.apiBase=https://api.siliconflow.cn/v1
llm.planner.apiKey=
llm.planner.chatModel=deepseek-ai/DeepSeek-V4-Flash
llm.planner.temperature=0.6
llm.planner.frequencyPenalty=1.0
llm.planner.presencePenalty=0.8
llm.planner.enableCoT=true

# [大脑模型 Brain]
# 职责：系统的执行核心，负责遵循 Planner 的计划进行常规对话、工具参数组装、API调用。
# 建议：使用工具调用 (Function Calling) 能力强、遵循指令能力极高的大模型。
llm.brain.apiBase=https://api.siliconflow.cn/v1
llm.brain.apiKey=
llm.brain.chatModel=deepseek-ai/DeepSeek-V4-Flash
llm.brain.temperature=0.7
llm.brain.frequencyPenalty=1.0
llm.brain.presencePenalty=0.8
llm.brain.enableCoT=false

# [高级大脑模型 Advanced Brain]
# 职责：当常规 Brain 觉得任务太难，通过调用 "switch_to_advanced_model" 工具时唤醒的备用重型大脑。
# 建议：使用参数量最大、推理能力最强的深度思考模型 (如 DeepSeek-R1 / Kimi / Claude 3.5 Sonnet)。
# 目前暂时没用
llm.advanced_brain.apiBase=https://api.siliconflow.cn/v1
llm.advanced_brain.apiKey=
llm.advanced_brain.chatModel=Pro/moonshotai/Kimi-K2.6
llm.advanced_brain.temperature=0.6
llm.advanced_brain.frequencyPenalty=0.5
llm.advanced_brain.presencePenalty=0.5
llm.advanced_brain.enableCoT=true


# [记忆向量化模型 Embedding]
# 职责：将文本记忆转换为多维向量，存入 SQLite，用于实现长期记忆的检索（海马体）。
# 建议：使用专用的 Embedding 模型。温度必须为 0。
llm.embedding.apiBase=https://api.siliconflow.cn/v1
llm.embedding.apiKey=
llm.embedding.embeddingModel=Qwen/Qwen3-Embedding-4B
llm.embedding.temperature=0.0

# [定时调度模型 Scheduler]
# 职责：处理基于时间的周期性任务（如提醒、清理、总结），负责读取 scheduled.md。
llm.scheduler.apiBase=https://api.siliconflow.cn/v1
llm.scheduler.apiKey=
llm.scheduler.chatModel=deepseek-ai/DeepSeek-V4-Flash
llm.scheduler.temperature=0.7
llm.scheduler.frequencyPenalty=1.0
llm.scheduler.presencePenalty=0.8
llm.scheduler.enableCoT=true

# [视觉神经模型 Vision]
# 职责：负责解析 QQ 聊天中发来的图片内容，将其转化为文字描述。
# 建议：使用支持多模态视觉 (VLM) 的模型。
llm.vision.apiBase=https://api.siliconflow.cn/v1
llm.vision.apiKey=
llm.vision.chatModel=Qwen/Qwen3.6-35B-A3B
llm.vision.temperature=0.0


# ------------------------------------------
# 2. 认知引擎心跳参数 (控制 Agent 的 "生物节律")
# ------------------------------------------

# 门神模型轮询检查新消息的间隔 (单位: 毫秒)。设得越小反应越快，但耗费 CPU。
cognitive.cycleTicks=3000
# 判断一个对话是否"熟透"的时间参数，即对方多久没发新消息了才开始回复。
cognitive.messageWaitingTime=5
# 大脑皮层在彻底完成一个任务前，最多允许循环思考/调用工具的次数 (防止死循环)。
cognitive.consumerCyclingTime=10
# 代理处理多少个任务后，强制触发一次对自身的反思 (写入 thoughts.md)。
cognitive.taskCountForReflection=10
# 代理多久主动去检查一次定时日程 scheduled.md (单位: 毫秒)。36000000 约为 10 小时。
cognitive.scheduleCyclingTime=36000000
# 大脑任务队列允许积压的最大任务数，超过此数量将抛弃最旧的任务 (防 OOM 内存溢出)。
cognitive.maxTaskAmount=2

cognitive.randomChatChance=0.05
cognitive.rateLimitMs=5000


# ------------------------------------------
# 3. 海马体记忆参数
# ------------------------------------------

# 塞给大模型的短期上下文记忆上限 (条数)。
memory.currentMemoriesMaxSize=8
# 每次通过向量检索 (Embedding) 找回的历史长期记忆条数。
memory.embMemorySize=32
# 大模型调用 get_history 工具时，单次分页返回的消息记录条数。
memory.historyViewAmount=30
# 获取向量化深度记忆的搜索深度/阈值参数。
memory.chatHistoryViewAmount=20
# 聊天任务中llm单次可以看到的历史消息条目数
memory.memoryDepth=5
# SQLite 记忆数据库的本地存储路径。
memory.dbUrl=jdbc:sqlite:agent_memory.db


# ------------------------------------------
# 4. Napcat 物理通信配置 (QQ机器人底层协议)
# ------------------------------------------

# Napcat 提供的正向 WebSocket 地址，用于接收实时事件和消息。
napcat.wsUrl=127.0.0.1
# Napcat 的 WS 监听端口。
napcat.wsPort=3001
# Napcat 的 HTTP API 地址，用于主动拉取群列表、好友信息、历史记录。
napcat.httpUrl=http://127.0.0.1:3000
# Napcat 设置的访问令牌 (如果没设置就留空)。
napcat.token=

# ------------------------------------------
# 5. Discord 物理通信配置 (Discord Bot)
# ------------------------------------------

# Discord Bot Token（从 Discord Developer Portal 获取）
discord.botToken=
# 允许的服务器 ID 列表（逗号分隔，留空则允许所有）
discord.allowedGuilds=
# 是否启用 Discord 适配器（false 则跳过初始化）
discord.enabled=true

# ------------------------------------------
# 6. Bot 個人化設定
# ------------------------------------------
# 部署者的 Discord 用戶 ID（用於 ${deployer_role} 模板變量）
bot.deployerRole=

# ------------------------------------------
# 7. 網路搜尋設定
# ------------------------------------------
# Brave Search API Key（可選，無填入則降級用 DuckDuckGo）
search.braveApiKey=
# Jina AI API Key（可選，提升 read_webpage 速率上限）
search.jinaApiKey=