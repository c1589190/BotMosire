# ==========================================
# LivingLoop Agent 主配置文件 (模板)
# 提示: 系统会优先读取环境变量 SILICONFLOW_API_KEY，若不存在则读取本文件中的 apiKey 配置。
# ==========================================

# ------------------------------------------
# 1. LLM 矩阵配置 (混合大模型编排)
# ------------------------------------------

# [门神模型 Gatekeeper]
# 职责：用于消息进件时的快速分类、判断是否值得关注、过滤群聊噪音。
# 建议：使用响应速度极快的小模型，无需过高智商，温度可调低以保证决策的一致性。
# 暂时没用，可以不配置
llm.gatekeeper.apiBase=https://api.siliconflow.cn/v1
llm.gatekeeper.apiKey=
llm.gatekeeper.chatModel=Pro/deepseek-ai/DeepSeek-V3.2
llm.gatekeeper.temperature=0.3
llm.gatekeeper.enableCoT=true
# Per-model HTTP 超时（秒）。Gatekeeper 反应要快，readTimeout 短一点防止卡住认知循环。
llm.gatekeeper.connectTimeoutSec=30
llm.gatekeeper.readTimeoutSec=30
llm.gatekeeper.writeTimeoutSec=30

# [大脑模型 Brain]
# 职责：系统的执行核心，负责工具调用、API 组装、多步推理。
# 建议：使用工具调用 (Function Calling) 能力强、遵循指令能力极高的大模型。
llm.brain.apiBase=https://api.siliconflow.cn/v1
llm.brain.apiKey=
llm.brain.chatModel=Pro/deepseek-ai/DeepSeek-V3.2
llm.brain.temperature=0.6
llm.brain.frequencyPenalty=0.4
llm.brain.presencePenalty=0.5
llm.brain.enableCoT=false
llm.brain.maxTokens=65535
# 是否启用流式输出（SSE），默认开启。关闭后使用非流式请求。
llm.brain.stream=true
# Brain 模型多步推理 + 工具调用可能慢，readTimeout 给 180 秒
llm.brain.connectTimeoutSec=30
llm.brain.readTimeoutSec=180
llm.brain.writeTimeoutSec=30

# [记忆向量化模型 Embedding]
# 职责：将文本记忆转换为多维向量，用于长期记忆检索。
# 建议：使用专用 Embedding 模型，温度必须为 0。
llm.embedding.apiBase=https://api.siliconflow.cn/v1
llm.embedding.apiKey=
llm.embedding.embeddingModel=Qwen/Qwen3-Embedding-4B
llm.embedding.temperature=0.0
# Embedding 短文本即可，30 秒够用
llm.embedding.connectTimeoutSec=30
llm.embedding.readTimeoutSec=30
llm.embedding.writeTimeoutSec=30

# [视觉神经模型 Vision]
# 职责：解析图片内容并转化为文字描述。
# 建议：使用支持多模态视觉 (VLM) 的模型。
llm.vision.apiBase=https://api.siliconflow.cn/v1
llm.vision.apiKey=
llm.vision.chatModel=Qwen/Qwen3.6-35B-A3B
llm.vision.temperature=0.0
# Vision 解析图片需上传 + 解码，给 60 秒
llm.vision.connectTimeoutSec=30
llm.vision.readTimeoutSec=60
llm.vision.writeTimeoutSec=60

# [以下为预留的高级模型配置，当前代码中已注释，暂未启用]
# llm.planner.* 战略规划模型 (第0轮预思考)
# llm.advanced_brain.* 高级大脑模型 (难任务切换)
# llm.scheduler.* 定时调度模型 (周期性任务)

#模型调用超时时间
llm.timeoutTime=180000


# ------------------------------------------
# 2. 认知引擎心跳参数 (控制 Agent 的 "生物节律")
# ------------------------------------------

# 门神模型轮询检查新消息的间隔 (单位: 毫秒)。设得越小反应越快，但耗费 CPU。
cognitive.cycleTicks=8000
# 判断一个对话是否"熟透"的参数，即对方多久没发新消息了才开始回复 (计数周期，非毫秒)。
cognitive.messageWaitingTime=5
# 大脑皮层在彻底完成一个任务前，最多允许循环思考/调用工具的次数 (防止死循环)。
# 20 是网站任务（read→write→修 bug→update→发讯息）需要的下限；纯聊天可降回 10 省 token。
cognitive.consumerCyclingTime=20
# 代理处理多少个任务后，强制触发一次对自身的反思 (写入 thoughts.md)。
cognitive.taskCountForReflection=32
# 代理多久主动去检查一次定时日程 scheduled.md (单位: 毫秒)。
cognitive.scheduleCyclingTime=300000
# 大脑任务队列允许积压的最大任务数，超过此数量将抛弃最旧的任务 (防 OOM 内存溢出)。
cognitive.maxTaskAmount=3
# 任务挂起过期时间（毫秒），超过此时间且未执行中的任务将被自动删除。默认 300000 (5分钟)。【已废弃：现改用 maxTaskCognitiveAge】
cognitive.taskExpirationTimeMs=300000
# 任务认知年龄上限（消费者循环轮次），挂起任务的认知年龄达此值后自动删除。默认 12。
cognitive.maxTaskCognitiveAge=12
# Agent 通过 adjust_task_priority 工具单次可调整任务优先级的最大幅度。默认 0.4。
cognitive.taskPriorityAdjustmentRange=0.4
# 系统处于空虚状态时，随机捡起低价值消息的概率。
cognitive.randomChatChance=0.05
# Agent 每日默认休眠时间段（HH:mm 格式），留空表示不自动休眠。
# 支持跨天（如 22:00 ~ 06:00），休眠期间不接收任何外部输入。
agent.sleepStart=
agent.sleepEnd=
# CodeAgent 子执行体是否启用浏览器自动化（Playwright MCP，需本机有 Node/npx；首次用会下载 chromium）。
# 关掉则子执行体只保留文件能力。
agent.codeBrowserEnabled=true
# CodeAgent 是否启用桌面操控（Windows-MCP，需 uv/uvx）。默认 false：桌面控制可操作整台电脑，
# 风险高（已自动排除 PowerShell/Registry/FileSystem/Process），建议配好 master 名单后再开。
agent.codeDesktopEnabled=false
# 主人 id 名单（逗号分隔，如 "12345678,87654321"）。delegate_computer_task（文件/浏览器/桌面）
# 仅放行主人或内部渠道（控制台/定时/反思/网页）触发；外部聊天里非主人调用会被拒绝。
# 留空 = 外部聊天一律不能触发电脑操作（最安全默认）。
agent.masterIds=

# 同一用户请求的速率限制间隔 (毫秒)。
cognitive.rateLimitMs=5000

# ------------------------------------------
# 2b. 消息关键词系统 (Message Keyword)
# ------------------------------------------
# LLM 可通过 manage_message_keywords 工具自行设置消息筛选关键词，
# 命中关键词的消息会在 Gatekeeper 阶段获得额外权重加分。

# LLM 可设置的单条关键词最小权重。
messageKeyword.weightMin=0.1
# LLM 可设置的单条关键词最大权重（钳位上限）。
messageKeyword.weightMax=2.0
# LLM 不指定权重时的默认值。
messageKeyword.defaultWeight=0.5
# 最多同时活跃的关键词数量，超限后 add 会被拒绝。
messageKeyword.maxKeywords=20
# 关键词默认有效期（分钟），0=永不过期，LLM 可覆盖。
messageKeyword.defaultTTLMinutes=30
# 预设挂起任务的等待时间，单位毫秒。
cognitive.pendingChatWaitingTime=180000
# 认知热度上限，防止压力值无限增长。
cognitive.maxCognitiveHeat=24
# 被 @提及 时是否强制放行（跳过感觉评估直接创建任务）。默认 true。
cognitive.alwaysRespondToAtMe=true
# Input积压区最大容量（仅存放暂未审查的聊天消息），超出丢弃最旧。
cognitive.inputBacklogMaxSize=128
# 单次从积压区择优审查时，最多生成多少个Task（防止瞬间塞满队列）。
cognitive.inputReviewBatchSize=2


# ------------------------------------------
# 3. 海马体记忆参数
# ------------------------------------------

# 短期上下文记忆上限 (条数)。
memory.currentMemoriesMaxSize=16
# 每次通过向量检索找回的历史长期记忆条数。
memory.embMemorySize=32
# 大模型调用 get_history 工具时，单次分页返回的消息记录条数。
memory.historyViewAmount=20
# 聊天任务中 llm 单次可以看到的历史消息条目数。
memory.chatHistoryViewAmount=20
# 长期记忆检索深度 / 搜索阈值参数。
memory.memoryDepth=3
# SQLite 记忆数据库的本地存储路径。
memory.dbUrl=jdbc:sqlite:agent_memory.db

# 感觉维度：判断概念是否与已有维度匹配的相似度阈值 (0~1)。
memory.noveltyThreshold=0.6
# 感觉维度：替换阈值（需 >= noveltyThreshold），新概念与旧维度相似度达此值时直接覆写旧词+旧向量。
memory.fdReplaceThreshold=0.85
# 感觉维度：旧记忆衰减常数 (当前未直接使用，预留)。
memory.decayConstant=0.01
# 脊髓反射阈值 (不经大脑直接回复的最低相似度，0~1，越小越容易触发反射)。
memory.spinalReflexThreshold=0.4
# 感觉维度：兴趣下限 (欲望/注意力最低值)。
memory.fdBluntWeight=0.25
# 感觉维度：单个维度权重的上限。
memory.fdMaxWeight=1.0
# 感觉维度：脱敏曲线触发上限 (触发次数达到此值后彻底腻味)。
memory.fdHabituationLimit=10
# 感觉维度：压力惩罚系数 (当前未直接使用，预留)。
memory.fdPressurePenalty=0.01
# 感觉维度：新经验对权重的冲击系数 (动量更新中的 ALPHA)。
memory.fdQualityWeight=0.5
# 判断任务参数感觉维度好坏时，获取最相似的多少感觉
memory.feelingDimensionCount=3

memory.maxContextCacheRounds=128


# ------------------------------------------
# 4. Napcat 物理通信配置 (QQ机器人底层协议)
# ------------------------------------------

# Napcat 提供的正向 WebSocket 地址，用于接收实时事件和消息。
napcat.wsUrl=127.0.0.1
# Napcat 的 WS 监听端口。
napcat.wsPort=3001
# Napcat 的 HTTP API 地址，用于主动拉取群列表、好友信息、历史记录。
napcat.httpUrl=http://127.0.0.1:3000
# Napcat 设置的访问令牌 (如果没设置就留空)。
napcat.token=


# ------------------------------------------
# 5. Bot 個人化設定
# ------------------------------------------

# 部署者的用户 ID (用于模板变量 ${deployer_role})。
bot.deployerRole=


# ------------------------------------------
# 6. 網路搜尋設定
# ------------------------------------------

# Brave Search API Key (留空则降级使用 DuckDuckGo/MetaSo)。
search.braveApiKey=
# Jina AI API Key (用于提升 read_webpage 速率上限)。
search.jinaApiKey=
# MetaSo AI Search API Key (备用搜索引擎/网页阅读器)。
search.metasoApiKey=


# ------------------------------------------
# 7. 工作区与沙盒目录
# ------------------------------------------

# 文件读写操作的根目录。
workspace.dir=workspace

# ------------------------------------------
# 8. WebServer 安全設定
# ------------------------------------------
# /api/agent/webhook 的 Bearer Token（空白=跳過驗證，本機開發時可留空）
# 正式對外部署時務必填入隨機字串，例如：web.webhookToken=my-secret-token-123
web.webhookToken=